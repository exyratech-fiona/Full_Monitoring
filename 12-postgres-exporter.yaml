# PostgreSQL exporters for up to six databases.
#
# Create each database Secret through the kubectl CLI before applying this
# file. Keep real credentials out of Git. Each database has its own Secret and
# exporter Deployment.
#
# DSN format:
#   postgresql://USER:PASSWORD@HOST:PORT/DATABASE?sslmode=disable

# DB1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter-db1
  namespace: monitoring
  labels:
    app.kubernetes.io/name: postgres-exporter
    database: db1
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
      database: db1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-exporter
        database: db1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
          ports:
            - name: metrics
              containerPort: 9187
          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-exporter-db1-secret
                  key: DATA_SOURCE_NAME
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi

