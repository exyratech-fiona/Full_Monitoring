# =====================================================================
# Centralised nginx -> Grafana (Exora G360 APM)
#
#   browser --> apm.devopslabs.tech (103.185.102.45)
#           --> this nginx
#           --http--> 192.168.0.162:30300  (dolsb001, Grafana NodePort)
#
# =====================================================================
# STAGE 1 (this file as-is): plain HTTP on :80.
#
# The previous version referenced a certificate at
#   /etc/letsencrypt/live/apm.devopslabs.tech/
# which does not exist yet. nginx treats a missing cert as a config
# error, and `systemctl reload nginx` then FAILS WHILE LEAVING THE OLD
# CONFIG RUNNING - nginx stays up, your block never loads, and there is
# no obvious symptom. Proven from outside: every SNI name, including a
# made-up one, was answered with the advisor360.demo certificate, i.e.
# the default vhost.
#
# Port 80 must work first anyway: certbot's HTTP-01 challenge is served
# over :80. So get this stage green, then issue the certificate.
#
# STAGE 2: once :80 proxies correctly, run
#     certbot --nginx -d apm.devopslabs.tech
# certbot issues the cert AND rewrites this file to add the :443 vhost
# and the http->https redirect. Then set GF_SECURITY_COOKIE_SECURE=true
# in 02-grafana.yaml and re-apply.
# =====================================================================

# ---------------------------------------------------------------------
# WebSocket upgrade map - http{} level.
#
# DELETE THIS BLOCK if $connection_upgrade is already defined elsewhere:
#     grep -rn "connection_upgrade" /etc/nginx/
# A duplicate variable makes nginx refuse to start.
# ---------------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream grafana_apm {
    # NodePort is published on every node; the others stand by so a
    # single node reboot does not take the dashboard down.
    server 192.168.0.162:30300 max_fails=3 fail_timeout=15s;          # dolsb001
    server 192.168.0.173:30300 max_fails=3 fail_timeout=15s backup;   # dola001
    server 192.168.0.177:30300 max_fails=3 fail_timeout=15s backup;   # dolkw001

    keepalive 16;
}

server {
    listen 80;
    server_name apm.devopslabs.tech;

    access_log /var/log/nginx/apm.access.log;
    error_log  /var/log/nginx/apm.error.log warn;

    # Dashboard JSON imports exceed the 1m default.
    client_max_body_size 50m;

    # Let certbot answer the HTTP-01 challenge without being proxied
    # through to Grafana (which would 404 it).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        proxy_pass http://grafana_apm;
        proxy_http_version 1.1;

        # WebSockets: Grafana Live, streaming panels, alert state pushes
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;

        # Grafana Live and query streaming are event-streams. With
        # buffering on, nginx holds the response until the buffer fills,
        # which looks exactly like a hung panel.
        proxy_buffering off;
        proxy_cache     off;

        proxy_connect_timeout 10s;
        proxy_read_timeout   600s;
        proxy_send_timeout   600s;
    }
}
