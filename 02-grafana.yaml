# =====================================================================
# Grafana. Datasources and dashboards are provisioned automatically from
# ConfigMaps (files 10 and 11). Admin credentials come from a Secret.
# CHANGE the admin password before any real deployment.
# =====================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
type: Opaque
stringData:
  admin-user: admin
  admin-password: "ChangeMe_Admin123!"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      serviceAccountName: grafana
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
      initContainers:
        - name: init-chown-data
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 472:472 /var/lib/grafana"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_FEATURE_TOGGLES_ENABLE
              value: "traceToMetrics,traceqlEditor"
            # ---------------------------------------------------------
            # Public address, as seen by the browser.
            #
            # %(domain)s defaults to "localhost". Behind the centralised
            # nginx at apm.devopslabs.tech that meant Grafana believed
            # its own address was http://localhost/, which breaks:
            #   - Grafana Live: the websocket Origin header is checked
            #     against root_url, so live panels are refused
            #   - absolute links in alert notifications and shared URLs
            #   - any future OAuth redirect_uri
            #
            # Login redirects happen to be relative, which is why basic
            # page loads still worked.
            # ---------------------------------------------------------
            - name: GF_SERVER_DOMAIN
              value: "apm.devopslabs.tech"

            # ---------------------------------------------------------
            # Hardcoded https, NOT %(protocol)s.
            #
            # %(protocol)s is Grafana's OWN listener protocol, which is
            # still plain http - TLS terminates at nginx. Left as
            # %(protocol)s this resolves to http://apm.devopslabs.tech/
            # while the browser sends Origin: https://apm.devopslabs.tech
            # on the Grafana Live websocket. Grafana checks that Origin
            # against root_url, sees a mismatch, and refuses the socket:
            # live panels and streaming queries silently stop updating.
            # ---------------------------------------------------------
            - name: GF_SERVER_ROOT_URL
              value: "https://apm.devopslabs.tech/"

            # Once the HTTPS vhost is confirmed working end to end, set
            # this to "true" so the session cookie is never sent over
            # plain HTTP. Held at false for now because it would also
            # block logging in directly via the NodePort
            # (http://<node>:30300), which is still the fallback path
            # while the proxy is being brought up.
            - name: GF_SECURITY_COOKIE_SECURE
              value: "false"

            # nginx terminates the connection; trust its X-Forwarded-*
            # headers so Grafana logs the real client IP and builds
            # https:// links once TLS is in front of it.
            - name: GF_SERVER_ENFORCE_DOMAIN
              value: "false"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
            # Remaps each dashboard JSON into a topic subdirectory so
            # foldersFromFilesStructure (11-grafana-dashboards.yaml) sorts
            # them into matching Grafana folders instead of one flat list.
            # Added 2026-09-16.
            items:
              - key: k8s-cluster.json
                path: Infrastructure/k8s-cluster.json
              - key: nodes.json
                path: Infrastructure/nodes.json
              - key: pods.json
                path: Infrastructure/pods.json
              - key: jvm.json
                path: APM/jvm.json
              - key: spring-boot.json
                path: APM/spring-boot.json
              - key: http-requests.json
                path: APM/http-requests.json
              - key: postgresql.json
                path: Database/postgresql.json
              - key: opentelemetry.json
                path: Platform/opentelemetry.json
              - key: tempo.json
                path: Tracing/tempo.json
              - key: loki.json
                path: Logs/loki.json
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30300   # reachable at http://<any-node-ip>:30300 for your external nginx
