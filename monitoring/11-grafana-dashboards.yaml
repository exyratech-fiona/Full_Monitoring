# =====================================================================
# Grafana dashboard provisioning.
#
#  * grafana-dashboard-provider : tells Grafana to load every *.json in
#                                 /var/lib/grafana/dashboards
#  * grafana-dashboards         : the dashboard JSON, one key per file
#
# These are compact, ready-to-use starter dashboards wired to the
# provisioned datasource UIDs (prometheus / tempo / loki). For richer
# community dashboards, import by ID in the UI (see README):
#   1860  Node Exporter Full
#   13332 kube-state-metrics
#   3662 / 6417  Kubernetes cluster / pods
#   4701  JVM (Micrometer)  |  9628  PostgreSQL
# =====================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: 'Observability'
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
data:
  k8s-cluster.json: |
    {
      "uid": "k8s-cluster", "title": "Kubernetes Cluster", "tags": ["kubernetes"],
      "schemaVersion": 39, "editable": true, "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {"type": "stat", "title": "Ready Nodes", "gridPos": {"h":6,"w":6,"x":0,"y":0},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [{"refId":"A","expr":"sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})"}]},
        {"type": "stat", "title": "Running Pods", "gridPos": {"h":6,"w":6,"x":6,"y":0},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [{"refId":"A","expr":"sum(kube_pod_status_phase{phase=\"Running\"})"}]},
        {"type": "stat", "title": "Namespaces", "gridPos": {"h":6,"w":6,"x":12,"y":0},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [{"refId":"A","expr":"count(kube_namespace_created)"}]},
        {"type": "stat", "title": "Pods Not Running", "gridPos": {"h":6,"w":6,"x":18,"y":0},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [{"refId":"A","expr":"sum(kube_pod_status_phase{phase!=\"Running\",phase!=\"Succeeded\"})"}]},
        {"type": "timeseries", "title": "CPU cores used by namespace", "gridPos": {"h":8,"w":12,"x":0,"y":6},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [{"refId":"A","expr":"sum by (namespace) (rate(container_cpu_usage_seconds_total{container!=\"\"}[5m]))","legendFormat":"{{namespace}}"}]},
        {"type": "timeseries", "title": "Memory used by namespace", "gridPos": {"h":8,"w":12,"x":12,"y":6},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [{"refId":"A","expr":"sum by (namespace) (container_memory_working_set_bytes{container!=\"\"})","legendFormat":"{{namespace}}"}]}
      ]
    }
  nodes.json: |
    {
      "uid": "nodes", "title": "Nodes", "tags": ["kubernetes","node"],
      "schemaVersion": 39, "editable": true, "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {"type": "timeseries", "title": "CPU usage % per node", "gridPos": {"h":8,"w":12,"x":0,"y":0},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [{"refId":"A","expr":"100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)","legendFormat":"{{instance}}"}]},
        {"type": "timeseries", "title": "Memory usage % per node", "gridPos": {"h":8,"w":12,"x":12,"y":0},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [{"refId":"A","expr":"(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100","legendFormat":"{{instance}}"}]},
        {"type": "timeseries", "title": "Disk usage % (root)", "gridPos": {"h":8,"w":12,"x":0,"y":8},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [{"refId":"A","expr":"(1 - (node_filesystem_avail_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay\"} / node_filesystem_size_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay\"})) * 100","legendFormat":"{{instance}}"}]},
        {"type": "timeseries", "title": "Network receive (bytes/s)", "gridPos": {"h":8,"w":12,"x":12,"y":8},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [{"refId":"A","expr":"sum by (instance) (rate(node_network_receive_bytes_total{device!~\"lo|veth.*\"}[5m]))","legendFormat":"{{instance}}"}]}
      ]
    }
  pods.json: |
    {
      "uid": "pods", "title": "Pods", "tags": ["kubernetes","pods"],
      "schemaVersion": 39, "editable": true, "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {"type": "timeseries", "title": "Container restarts (increase 1h)", "gridPos": {"h":8,"w":12,"x":0,"y":0},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [{"refId":"A","expr":"sum by (namespace,pod) (increase(kube_pod_container_status_restarts_total[1h]))","legendFormat":"{{namespace}}/{{pod}}"}]},
        {"type": "timeseries", "title": "CPU by pod", "gridPos": {"h":8,"w":12,"x":12,"y":0},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [{"refId":"A","expr":"sum by (pod) (rate(container_cpu_usage_seconds_total{container!=\"\"}[5m]))","legendFormat":"{{pod}}"}]},
        {"type": "timeseries", "title": "Memory by pod", "gridPos": {"h":8,"w":12,"x":0,"y":8},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [{"refId":"A","expr":"sum by (pod) (container_memory_working_set_bytes{container!=\"\"})","legendFormat":"{{pod}}"}]},
        {"type": "table", "title": "Pods in bad state", "gridPos": {"h":8,"w":12,"x":12,"y":8},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [{"refId":"A","expr":"kube_pod_container_status_waiting_reason > 0","format":"table","instant":true}]}
      ]
    }
  jvm.json: |
    {
      "uid": "jvm", "title": "JVM", "tags": ["jvm","otel"],
      "schemaVersion": 39, "editable": true, "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {"type": "timeseries", "title": "Heap used", "gridPos": {"h":8,"w":12,"x":0,"y":0},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [{"refId":"A","expr":"sum by (service_name) (jvm_memory_used_bytes{jvm_memory_type=\"heap\"})","legendFormat":"{{service_name}}"}]},
        {"type": "timeseries", "title": "Heap used % of limit", "gridPos": {"h":8,"w":12,"x":12,"y":0},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [{"refId":"A","expr":"100 * sum by (service_name) (jvm_memory_used_bytes{jvm_memory_type=\"heap\"}) / sum by (service_name) (jvm_memory_limit_bytes{jvm_memory_type=\"heap\"})","legendFormat":"{{service_name}}"}]},
        {"type": "timeseries", "title": "GC pause rate (s/s)", "gridPos": {"h":8,"w":12,"x":0,"y":8},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [{"refId":"A","expr":"sum by (service_name) (rate(jvm_gc_duration_seconds_sum[5m]))","legendFormat":"{{service_name}}"}]},
        {"type": "timeseries", "title": "Live threads", "gridPos": {"h":8,"w":12,"x":12,"y":8},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [{"refId":"A","expr":"sum by (service_name) (jvm_thread_count)","legendFormat":"{{service_name}}"}]}
      ]
    }
  spring-boot.json: |
    {
      "uid": "spring-boot", "title": "Spring Boot", "tags": ["spring","otel"],
      "schemaVersion": 39, "editable": true, "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {"type": "stat", "title": "Request rate (req/s)", "gridPos": {"h":6,"w":8,"x":0,"y":0},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [{"refId":"A","expr":"sum(rate(calls_total[5m]))"}]},
        {"type": "stat", "title": "Error rate (req/s)", "gridPos": {"h":6,"w":8,"x":8,"y":0},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [{"refId":"A","expr":"sum(rate(calls_total{status_code=\"STATUS_CODE_ERROR\"}[5m]))"}]},
        {"type": "stat", "title": "p95 latency (ms)", "gridPos": {"h":6,"w":8,"x":16,"y":0},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [{"refId":"A","expr":"histogram_quantile(0.95, sum by (le) (rate(duration_milliseconds_bucket[5m])))"}]},
        {"type": "timeseries", "title": "Requests by route", "gridPos": {"h":8,"w":24,"x":0,"y":6},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [{"refId":"A","expr":"sum by (http_route) (rate(calls_total[5m]))","legendFormat":"{{http_route}}"}]}
      ]
    }
  postgresql.json: |
    {
      "uid": "postgresql", "title": "PostgreSQL", "tags": ["postgres"],
      "schemaVersion": 39, "editable": true, "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {"type": "stat", "title": "Up", "gridPos": {"h":6,"w":6,"x":0,"y":0},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [{"refId":"A","expr":"pg_up"}]},
        {"type": "timeseries", "title": "Active connections", "gridPos": {"h":8,"w":18,"x":6,"y":0},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [{"refId":"A","expr":"sum by (datname) (pg_stat_database_numbackends)","legendFormat":"{{datname}}"}]},
        {"type": "timeseries", "title": "Commits vs Rollbacks", "gridPos": {"h":8,"w":12,"x":0,"y":8},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [
           {"refId":"A","expr":"sum(rate(pg_stat_database_xact_commit[5m]))","legendFormat":"commits"},
           {"refId":"B","expr":"sum(rate(pg_stat_database_xact_rollback[5m]))","legendFormat":"rollbacks"}]},
        {"type": "timeseries", "title": "Tuples fetched/returned", "gridPos": {"h":8,"w":12,"x":12,"y":8},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [
           {"refId":"A","expr":"sum(rate(pg_stat_database_tup_fetched[5m]))","legendFormat":"fetched"},
           {"refId":"B","expr":"sum(rate(pg_stat_database_tup_returned[5m]))","legendFormat":"returned"}]}
      ]
    }
  http-requests.json: |
    {
      "uid": "http-requests", "title": "HTTP Requests", "tags": ["http","otel","spanmetrics"],
      "schemaVersion": 39, "editable": true, "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {"type": "timeseries", "title": "Request rate by status", "gridPos": {"h":8,"w":12,"x":0,"y":0},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [{"refId":"A","expr":"sum by (status_code) (rate(calls_total[5m]))","legendFormat":"{{status_code}}"}]},
        {"type": "timeseries", "title": "Latency percentiles (ms)", "gridPos": {"h":8,"w":12,"x":12,"y":0},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [
           {"refId":"A","expr":"histogram_quantile(0.50, sum by (le) (rate(duration_milliseconds_bucket[5m])))","legendFormat":"p50"},
           {"refId":"B","expr":"histogram_quantile(0.95, sum by (le) (rate(duration_milliseconds_bucket[5m])))","legendFormat":"p95"},
           {"refId":"C","expr":"histogram_quantile(0.99, sum by (le) (rate(duration_milliseconds_bucket[5m])))","legendFormat":"p99"}]},
        {"type": "timeseries", "title": "Top routes by traffic", "gridPos": {"h":8,"w":24,"x":0,"y":8},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [{"refId":"A","expr":"topk(10, sum by (http_route) (rate(calls_total[5m])))","legendFormat":"{{http_route}}"}]}
      ]
    }
  opentelemetry.json: |
    {
      "uid": "opentelemetry", "title": "OpenTelemetry Collector", "tags": ["otel"],
      "schemaVersion": 39, "editable": true, "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {"type": "timeseries", "title": "Spans received/s", "gridPos": {"h":8,"w":12,"x":0,"y":0},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [{"refId":"A","expr":"sum(rate(otelcol_receiver_accepted_spans[5m]))","legendFormat":"accepted"}]},
        {"type": "timeseries", "title": "Spans exported vs refused/s", "gridPos": {"h":8,"w":12,"x":12,"y":0},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [
           {"refId":"A","expr":"sum(rate(otelcol_exporter_sent_spans[5m]))","legendFormat":"sent"},
           {"refId":"B","expr":"sum(rate(otelcol_exporter_send_failed_spans[5m]))","legendFormat":"failed"}]},
        {"type": "timeseries", "title": "Log records & metric points/s", "gridPos": {"h":8,"w":12,"x":0,"y":8},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [
           {"refId":"A","expr":"sum(rate(otelcol_receiver_accepted_log_records[5m]))","legendFormat":"logs"},
           {"refId":"B","expr":"sum(rate(otelcol_receiver_accepted_metric_points[5m]))","legendFormat":"metrics"}]},
        {"type": "timeseries", "title": "Collector memory (RSS)", "gridPos": {"h":8,"w":12,"x":12,"y":8},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [{"refId":"A","expr":"otelcol_process_memory_rss","legendFormat":"rss"}]}
      ]
    }
  tempo.json: |
    {
      "uid": "tempo", "title": "Tempo", "tags": ["tempo","tracing"],
      "schemaVersion": 39, "editable": true, "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {"type": "timeseries", "title": "Spans ingested/s", "gridPos": {"h":8,"w":12,"x":0,"y":0},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [{"refId":"A","expr":"sum(rate(tempo_distributor_spans_received_total[5m]))","legendFormat":"received"}]},
        {"type": "timeseries", "title": "Trace search / query latency", "gridPos": {"h":8,"w":12,"x":12,"y":0},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [{"refId":"A","expr":"histogram_quantile(0.99, sum by (le) (rate(tempo_request_duration_seconds_bucket[5m])))","legendFormat":"p99"}]},
        {"type": "traces", "title": "Search traces (TraceQL)", "gridPos": {"h":10,"w":24,"x":0,"y":8},
         "datasource": {"type":"tempo","uid":"tempo"},
         "targets": [{"refId":"A","queryType":"traceqlSearch","datasource":{"type":"tempo","uid":"tempo"},"filters":[]}]}
      ]
    }
  loki.json: |
    {
      "uid": "loki", "title": "Loki", "tags": ["loki","logs"],
      "schemaVersion": 39, "editable": true, "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {"type": "timeseries", "title": "Log lines ingested/s", "gridPos": {"h":8,"w":12,"x":0,"y":0},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [{"refId":"A","expr":"sum(rate(loki_distributor_lines_received_total[5m]))","legendFormat":"lines"}]},
        {"type": "timeseries", "title": "Ingested bytes/s", "gridPos": {"h":8,"w":12,"x":12,"y":0},
         "datasource": {"type":"prometheus","uid":"prometheus"},
         "targets": [{"refId":"A","expr":"sum(rate(loki_distributor_bytes_received_total[5m]))","legendFormat":"bytes"}]},
        {"type": "logs", "title": "Application logs", "gridPos": {"h":12,"w":24,"x":0,"y":8},
         "datasource": {"type":"loki","uid":"loki"},
         "targets": [{"refId":"A","expr":"{service_name=~\".+\"}","datasource":{"type":"loki","uid":"loki"}}]}
      ]
    }
