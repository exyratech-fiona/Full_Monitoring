# =====================================================================
# PostgreSQL Exporter — exposes PostgreSQL metrics (pg_up, connections,
# transactions, ...) for Prometheus.
#
# ACTION REQUIRED: set the real connection string in the Secret below.
# DATA_SOURCE_NAME format:
#   postgresql://USER:PASSWORD@HOST:5432/DBNAME?sslmode=disable
# Use a read-only monitoring role in production.
# =====================================================================
apiVersion: v1
kind: Secret
metadata:
  name: postgres-exporter-secret
  namespace: monitoring
  labels:
    app.kubernetes.io/name: postgres-exporter
type: Opaque
stringData:
  DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres.default.svc.cluster.local:5432/postgres?sslmode=disable"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
          ports:
            - name: metrics
              containerPort: 9187
          envFrom:
            - secretRef:
                name: postgres-exporter-secret
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: postgres-exporter
spec:
  selector:
    app.kubernetes.io/name: postgres-exporter
  ports:
    - name: metrics
      port: 9187
      targetPort: metrics
