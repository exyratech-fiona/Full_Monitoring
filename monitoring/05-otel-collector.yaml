# =====================================================================
# OpenTelemetry Collector
#
# Application
#     |
#     | OTLP
#     v
# OTel Collector
#     |
#     +---- traces ---> Tempo
#     |
#     +---- metrics --> Prometheus OTLP
#     |
#     +---- logs -----> Loki
#
# =====================================================================

apiVersion: v1
kind: ConfigMap

metadata:
  name: otel-collector-config
  namespace: monitoring

  labels:
    app.kubernetes.io/name: otel-collector

data:

  collector.yaml: |

    # =================================================================
    # RECEIVER
    # =================================================================

    receivers:

      otlp:

        protocols:

          grpc:

            endpoint: 0.0.0.0:4317

          http:

            endpoint: 0.0.0.0:4318


    # =================================================================
    # PROCESSORS
    # =================================================================

    processors:

      memory_limiter:

        check_interval: 5s

        limit_percentage: 80

        spike_limit_percentage: 25


      # ---------------------------------------------------------------
      # Batching
      #
      # Prometheus' OTLP receiver rejects an ENTIRE request on any
      # append error - there is no partial write. A max batch of 2048
      # therefore discards 2048 metric points per bad sample, which is
      # exactly what the collector logs were showing. Smaller batches
      # shrink the blast radius of a single poisoned series.
      # ---------------------------------------------------------------

      batch:

        timeout: 5s

        send_batch_size: 512

        send_batch_max_size: 512


      # ---------------------------------------------------------------
      # Kubernetes metadata
      # ---------------------------------------------------------------

      k8sattributes:

        auth_type: serviceAccount

        passthrough: false

        extract:

          metadata:

            - k8s.namespace.name
            - k8s.deployment.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.container.name

          labels:

            - tag_name: app
              key: app.kubernetes.io/name
              from: pod

        pod_association:

          - sources:

              - from: resource_attribute
                name: k8s.pod.ip

          - sources:

              - from: resource_attribute
                name: k8s.pod.uid

          - sources:

              - from: connection


    # =================================================================
    # SPANMETRICS
    #
    # Converts traces into HTTP RED metrics.
    #
    # calls_total
    # duration_milliseconds_bucket
    #
    # =================================================================

    connectors:

      spanmetrics:

        histogram:

          unit: ms

          explicit:

            buckets:

              - 5ms
              - 10ms
              - 25ms
              - 50ms
              - 100ms
              - 250ms
              - 500ms
              - 1s
              - 2s
              - 5s
              - 10s

        dimensions:

          - name: http.request.method

          - name: http.response.status_code

          - name: http.route

        exemplars:

          enabled: true

        metrics_flush_interval: 15s


    # =================================================================
    # EXPORTERS
    # =================================================================

    exporters:

      # ---------------------------------------------------------------
      # TRACES -> TEMPO
      # ---------------------------------------------------------------

      otlp/tempo:

        endpoint: tempo:4317

        tls:

          insecure: true


      # ---------------------------------------------------------------
      # METRICS -> PROMETHEUS OTLP
      #
      # TWO exporter instances pointing at the same endpoint, one per
      # metrics pipeline. Same destination, separate queues and
      # separate telemetry.
      #
      # Why: otelcol_exporter_send_failed_metric_points_total is
      # labelled by exporter. With a single shared exporter, a 400
      # tells you metrics are being dropped but not WHICH source is
      # poisoning the batch. Split like this, the Telemetry Pipeline
      # Health panel names the culprit at a glance - application
      # metrics or connector-derived spanmetrics.
      #
      # It is also an isolation fix: a bad spanmetrics series can no
      # longer take the application's metrics down with it.
      # ---------------------------------------------------------------

      # Application OTLP metrics (http.server.*, jvm.*, db.client.*)
      otlphttp/prometheus:

        endpoint: http://prometheus:9090/api/v1/otlp

      # Connector-derived RED metrics (calls, duration)
      otlphttp/prometheus_spanmetrics:

        endpoint: http://prometheus:9090/api/v1/otlp


      # ---------------------------------------------------------------
      # LOGS -> LOKI
      # ---------------------------------------------------------------

      otlphttp/loki:

        endpoint: http://loki:3100/otlp

        tls:

          insecure: true


    # =================================================================
    # EXTENSIONS
    # =================================================================

    extensions:

      health_check:

        endpoint: 0.0.0.0:13133


    # =================================================================
    # PIPELINES
    # =================================================================

    service:

      extensions:

        - health_check

      pipelines:

        # -------------------------------------------------------------
        # TRACES
        # -------------------------------------------------------------

        traces:

          receivers:

            - otlp

          processors:

            - memory_limiter
            - k8sattributes
            - batch

          exporters:

            - otlp/tempo
            - spanmetrics


        # -------------------------------------------------------------
        # METRICS - application
        #
        # Arrives over a real gRPC connection from the app pods, so
        # k8sattributes can associate it via pod_association.
        # -------------------------------------------------------------

        metrics/app:

          receivers:

            - otlp

          processors:

            - memory_limiter
            - k8sattributes
            - batch

          exporters:

            - otlphttp/prometheus


        # -------------------------------------------------------------
        # METRICS - spanmetrics
        #
        # Generated in-process by the connector, so there is NO client
        # connection for k8sattributes to associate against. Its
        # resource attributes were already enriched in the traces
        # pipeline, so k8sattributes is deliberately omitted here -
        # running it again on connector output risks rewriting
        # k8s.pod.name and collapsing both api-gateway pods onto one
        # label set, which Prometheus would reject as duplicate
        # samples for the same timestamp.
        # -------------------------------------------------------------

        metrics/spanmetrics:

          receivers:

            - spanmetrics

          processors:

            - memory_limiter
            - batch

          exporters:

            - otlphttp/prometheus_spanmetrics


        # -------------------------------------------------------------
        # LOGS
        # -------------------------------------------------------------

        logs:

          receivers:

            - otlp

          processors:

            - memory_limiter
            - k8sattributes
            - batch

          exporters:

            - otlphttp/loki


      # =================================================================
      # OTel Collector INTERNAL metrics
      #
      # Prometheus still scrapes these from port 8888.
      # =================================================================

      telemetry:

        metrics:

          readers:

            - pull:

                exporter:

                  prometheus:

                    host: 0.0.0.0

                    port: 8888


---
# =====================================================================
# OpenTelemetry Collector Service
# =====================================================================

apiVersion: v1
kind: Service

metadata:
  name: otel-collector
  namespace: monitoring

  labels:
    app.kubernetes.io/name: otel-collector

spec:

  selector:
    app.kubernetes.io/name: otel-collector

  ports:

    # ---------------------------------------------------------------
    # Application -> OTel Collector
    # ---------------------------------------------------------------

    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc

    - name: otlp-http
      port: 4318
      targetPort: otlp-http

    # ---------------------------------------------------------------
    # Kept for compatibility.
    #
    # No longer used for application OTel metrics.
    # ---------------------------------------------------------------

    - name: prom-export
      port: 8889
      targetPort: prom-export

    # ---------------------------------------------------------------
    # Collector internal metrics
    # ---------------------------------------------------------------

    - name: prom-internal
      port: 8888
      targetPort: prom-internal

